project:
  type: website
  output-dir: _site
  # The homepage (index.html) is hand-written HTML, so Quarto only copies it.
  # Quarto renders the .qmd pages (for now just the Bookshelf).
  resources:
    - index.html
    - CNAME
    - images/*

website:
  title: "Abdul Zarbi"
  description: "Senior Data Analyst in healthcare and the public sector, Austin, Texas"
  site-url: https://abdulzarbi.com
  favicon: images/favicon.png
  open-graph: true

  navbar:
    title: "Abdul Zarbi"
    href: index.html
    left:
      - text: "Home"
        href: index.html
      - text: "Portfolio"
        href: index.html#portfolio
      - text: "Bookshelf"
        href: books.qmd
      - text: "Contact"
        href: index.html#contact
    right:
      - icon: github
        href: https://github.com/AbdulZarbi
        aria-label: GitHub
      - icon: linkedin
        href: https://www.linkedin.com/in/abdulzarbi
        aria-label: LinkedIn
      - icon: medium
        href: https://medium.com/@abdulwasayzarbi
        aria-label: Medium
      - text: "Tableau"
        href: https://public.tableau.com/app/profile/abdul.zarbi/vizzes

  page-footer:
    center: "© Abdul Zarbi · Austin, Texas"

format:
  html:
    theme: cosmo
    css: styles.css
    # Same cookie banner + consent-gated Google Analytics as the homepage
    include-in-header: _includes/analytics.html
    link-external-newwindow: true
